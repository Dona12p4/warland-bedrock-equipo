name: Revisar paquetes y colaboracion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/team.py check
      - run: python -m unittest discover -s tests -v
  linux-bedrock:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Revisar lanzadores Linux y Python de Ubuntu
        run: |
          bash -n PREPARAR-EQUIPO.sh ABRIR-CODEX.sh ABRIR-CATALOGO.sh ACTUALIZAR-Y-PROBAR.sh
          python -m unittest discover -s tests -v
      - name: Probar BDS Linux con el mundo publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_linux_lab.py
      - name: Guardar evidencia sin mundos ni credenciales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-bedrock-validation
          path: |
            .local/linux-native.json
            .local/linux-native.log
